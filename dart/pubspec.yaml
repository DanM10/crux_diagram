version: 0.1.0
repository: https://github.com/DanM10/crux_diagram/tree/main/dart
issue_tracker: https://github.com/DanM10/crux_diagram/issues
topics:
  - drawing
  - canvas
  - editor
  - shapes
  - diagram

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

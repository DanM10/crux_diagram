name: soft_drawer_service
description: A Flutter 2D shape editor with snapping, rotation and anchor-based joint arrows. Build drawings from basic shapes and export them as JPEG.
version: 0.0.1
# repository and issue_tracker are added once the remote repository exists.
topics:
  - drawing
  - canvas
  - editor
  - shapes
  - diagram

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

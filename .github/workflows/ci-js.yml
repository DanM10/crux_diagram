name: ci-js

# No `paths:` filter at workflow level: a workflow skipped by it never reports
# a status, and a required check would wait forever (CI-004). The workflow always
# runs, `changes` decides whether JS tests are needed, and `ci-js-ok` is the only
# check to mark as required in the `main` branch protection.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            js:
              - 'js/**'
              - 'spec/**'
              - 'fixtures/**'
              - '.github/workflows/ci-js.yml'

  test:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ci-js-ok:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "test:    ${{ needs.test.result }}"
          # A skipped `test` (no JS changes) is a pass; failure or cancelled is not.
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.test.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

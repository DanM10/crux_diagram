name: ci-js

on:
  pull_request:
    paths: ['js/**', 'spec/**', 'fixtures/**', '.github/workflows/ci-js.yml']
  push:
    branches: [main]
    paths: ['js/**', 'spec/**', 'fixtures/**', '.github/workflows/ci-js.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
